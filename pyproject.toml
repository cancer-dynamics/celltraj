[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "celltraj"
version = "0.1.86"
description = "Toolset for single-cell trajectory modeling."
readme = "README.rst"
requires-python = ">=3.8"
authors = [
  { name = "Jeremy Copperman", email = "copperma@ohsu.edu" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "h5py",
  "matplotlib",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "pot",
  "csaps",
  "click",
]

[project.urls]
Homepage = "https://github.com/cancer-dynamics/celltraj"
Documentation = "https://cancerdynamics.org/docs/celltraj/"
Issues = "https://github.com/cancer-dynamics/celltraj/issues"

[project.optional-dependencies]
dependencies = [
  "pcdiff",
  "pyntcloud",
  "pandas",
  "fipy",
  "nanomesh",
  "multipoles",
  "pyemma",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "myst-parser>=2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
celltraj = "celltraj.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
